name: Import Design Tokens

on:
  workflow_call:
    inputs:
      issue-number:
        required: true
        type: number
      issue-title:
        required: true
        type: string
      issue-body:
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  import-tokens:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Parse import issue
        id: parse
        uses: issue-ops/parser@v5
        with:
          body: ${{ inputs.issue-body }}
          issue-form-template: import-tokens.yaml

      # The field holds untrusted issue text, so it reaches the parser through an
      # env var — never a shell argument or a `${{ }}` interpolation in a run
      # block. The parser also allow-lists the host, so this step cannot be
      # talked into fetching an arbitrary URL.
      - name: Resolve attachment URL
        id: attachment
        env:
          TOKEN_FILE_FIELD: ${{ steps.parse.outputs['parsed_token-file'] }}
        run: |
          set -euo pipefail
          URL=$(npx tsx .github/scripts/attachment-url.ts)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Attachment: $URL"

      # GitHub has no supported API for issue attachments; the documented-enough
      # path is to follow the redirect to the pre-signed asset URL. No auth
      # header is sent — the signature is already in the redirect, and adding one
      # breaks it. 2 MB is far more than any sane token document.
      - name: Download token file
        env:
          ATTACHMENT_URL: ${{ steps.attachment.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --max-filesize 2097152 \
            --max-time 60 \
            --user-agent "design-tokens-import-bot" \
            --output "$RUNNER_TEMP/import.json" \
            "$ATTACHMENT_URL"
          echo "Downloaded $(wc -c < "$RUNNER_TEMP/import.json") bytes"

      - name: Create branch for changes
        id: branch
        env:
          ISSUE_TITLE: ${{ inputs.issue-title }}
          ISSUE_NUMBER: ${{ inputs.issue-number }}
        run: |
          set -euo pipefail
          SLUG=$(printf '%s' "$ISSUE_TITLE" \
            | sed 's/\[.*\] //' \
            | tr '[:upper:]' '[:lower:]' \
            | tr ' ' '-' \
            | tr -cd '[:alnum:]-' \
            | head -c 50)
          BRANCH_NAME="token-request/${ISSUE_NUMBER}-import-${SLUG}"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"

      - name: Run import token script
        env:
          HIERARCHY: ${{ steps.parse.outputs.parsed_hierarchy }}
          MODE: ${{ steps.parse.outputs.parsed_mode }}
        run: |
          set -euo pipefail
          npx tsx .github/scripts/import-tokens.ts \
            --hierarchy "$HIERARCHY" \
            --mode "$MODE" \
            --file "$RUNNER_TEMP/import.json" \
            --summary "$RUNNER_TEMP/import-summary.md"

      - name: Commit and push changes
        id: commit
        env:
          ACTIONS_PAT: ${{ secrets.ACTIONS_PAT }}
          ISSUE_TITLE: ${{ inputs.issue-title }}
          ISSUE_NUMBER: ${{ inputs.issue-number }}
        run: |
          set -euo pipefail
          git add tokens/
          if git diff --staged --quiet; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit"
          else
            if [ -n "${ACTIONS_PAT}" ]; then
              git remote set-url origin "https://x-access-token:${ACTIONS_PAT}@github.com/${{ github.repository }}"
            fi

            git commit -m "feat(tokens): ${ISSUE_TITLE}" -m "Closes #${ISSUE_NUMBER}"
            git push origin "${{ steps.branch.outputs.branch_name }}"
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.commit.outputs.changes == 'true'
        uses: actions/github-script@v7
        env:
          HIERARCHY: ${{ steps.parse.outputs.parsed_hierarchy }}
          MODE: ${{ steps.parse.outputs.parsed_mode }}
          DESCRIPTION: ${{ steps.parse.outputs.parsed_description }}
          ISSUE_TITLE: ${{ inputs.issue-title }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
        with:
          github-token: ${{ secrets.ACTIONS_PAT || github.token }}
          script: |
            const fs = require('fs');
            const issueNumber = ${{ inputs.issue-number }};

            // Read the summary the script wrote rather than re-parsing the issue:
            // a token document embedded in a template literal would break on the
            // first quote it contains.
            const summaryPath = `${process.env.RUNNER_TEMP}/import-summary.md`;
            const summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8')
              : '_No summary produced._';

            const prBody = [
              '## Token Import',
              '',
              `This PR was automatically generated from issue #${issueNumber}.`,
              '',
              '### Details',
              `- **Action**: IMPORT`,
              `- **Hierarchy**: \`${process.env.HIERARCHY}\``,
              `- **Mode**: \`${process.env.MODE}\``,
              '',
              '### Description',
              process.env.DESCRIPTION || 'No description provided.',
              '',
              '### Changes',
              summary,
              '',
              '---',
              '',
              '**Reviewers**: Please verify the imported tokens before merging. The',
              'build preview comment below lists every resolved value that changed.',
              '',
              `Closes #${issueNumber}.`,
            ].join('\n');

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: process.env.ISSUE_TITLE,
              head: process.env.BRANCH_NAME,
              base: 'main',
              body: prBody
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `✅ Pull request created: #${pr.data.number}\n\nYour token import is ready for review.`
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.data.number,
              labels: ['token-change', 'import']
            });

      - name: Handle no changes
        if: steps.commit.outputs.changes == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ACTIONS_PAT || github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.issue-number }},
              body: `⚠️ The import produced no changes. Every token in the document already exists with the same value, type and description.`
            });
