<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design Tokens Preview</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <!-- ── Header ───────────────────────────────────────── -->
      <header class="header">
        <h1 class="header-title">🎨 Design Tokens</h1>
        <p class="header-sub">
          Browse, search, and copy tokens. Click any value to copy it.
          Click a <span class="header-hint-ref">reference</span> to jump to its definition.
        </p>
        <div class="search-row">
          <input
            class="search-input"
            type="text"
            id="searchInput"
            placeholder="Search by name, value, description…"
            autocomplete="off"
            spellcheck="false"
          />
          <div class="view-toggle" role="group" aria-label="View">
            <button type="button" class="view-btn active" data-view="list" aria-pressed="true">☰ List</button>
            <button type="button" class="view-btn" data-view="graph" aria-pressed="false">⑂ Graph</button>
          </div>
          <button class="reset-btn" id="resetBtn">Reset</button>
        </div>
        <div class="filter-tags" id="filterTags"></div>
      </header>

      <!-- ── Token grid ────────────────────────────────────── -->
      <main id="categories" class="categories-grid">
        <div class="empty-state">Loading tokens…</div>
      </main>

      <!-- ── Token graph ───────────────────────────────────── -->
      <section id="graph" class="category-card graph-card" hidden>
        <div class="category-header">
          <span class="category-name">Token tree</span>
          <span class="graph-hint">
            Click a group to fold it · hover a token to trace
            <span class="graph-key out">references</span> and
            <span class="graph-key in">referenced by</span> · click a token to open it ·
            Ctrl + scroll to zoom, drag to pan
          </span>
          <div class="graph-actions">
            <button type="button" class="filter-tag" data-graph="expand">Expand all</button>
            <button type="button" class="filter-tag" data-graph="collapse">Collapse all</button>
            <div class="graph-zoom-controls" role="group" aria-label="Zoom">
              <button type="button" class="filter-tag" data-zoom="out" aria-label="Zoom out">−</button>
              <button type="button" class="filter-tag graph-zoom-level" data-zoom="reset" title="Reset to 100%">100%</button>
              <button type="button" class="filter-tag" data-zoom="in" aria-label="Zoom in">+</button>
              <button type="button" class="filter-tag" data-zoom="fit" title="Fit the tree in view">Fit</button>
            </div>
          </div>
        </div>
        <div class="graph-scroll">
          <div class="graph-zoom">
            <div class="graph-canvas"></div>
          </div>
        </div>
      </section>
    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
